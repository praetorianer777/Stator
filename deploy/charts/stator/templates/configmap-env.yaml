apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stator.fullname" . }}-env
  labels:
    {{- include "stator.labels" . | nindent 4 }}
  annotations:
    # Before the Jobs of the Sync phase, which read it.
    argocd.argoproj.io/sync-wave: "-20"
data:
  {{- include "stator.env" . | nindent 2 }}
