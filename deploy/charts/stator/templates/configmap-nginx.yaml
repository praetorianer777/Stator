{{/*
deploy/nginx.conf proxies to the compose service name api, which resolves
nowhere else. This is that file with the real Service name, so a port-forward
to the web pod alone gives a working application. The Ingress sends /api to
the api Service directly, so this proxy is the fallback.
*/}}
{{- $csp := "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.figma.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" }}
{{- $api := printf "%s-api:%d" (include "stator.fullname" .) (int .Values.api.port) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stator.fullname" . }}-nginx
  labels:
    {{- include "stator.labels" . | nindent 4 }}
data:
  default.conf: |
    # Connections to the api are kept and reused: one per request runs out of
    # local ports at a few hundred requests a second. The Service's address
    # does not change, so it is resolved once at start.
    upstream stator_api {
        server {{ $api }};
        keepalive 64;
    }

    server {
        listen {{ .Values.web.port }};
        server_name _;
        root /usr/share/nginx/html;

        # A kept connection needs HTTP/1.1 and no "Connection: close".
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            # The api decides how large an upload may be.
            client_max_body_size 0;
            proxy_pass http://stator_api;
        }
        # Partner tools read every OAuth address from here (RFC 8414).
        location = /.well-known/oauth-authorization-server {
            proxy_pass http://stator_api;
        }
        # A page's shared draft is a WebSocket; the api pings it inside
        # nginx's minute of quiet.
        location ~ ^/api/v1/pages/[^/]+/collab$ {
            proxy_pass http://stator_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # A public link's token is the whole of the link; no log writes it.
        location ~ ^/api/v1/public/([^/]+/)?links/ {
            access_log off;
            proxy_pass http://stator_api;
        }
        location = /healthz {
            proxy_pass http://stator_api;
        }
        location = /readyz {
            proxy_pass http://stator_api;
        }

        # nginx's type table has no entry for a web app manifest, which would be
        # served as an anonymous download. No add_header here, so the server's
        # own headers still apply.
        location = /site.webmanifest {
            default_type application/manifest+json;
        }
        # The headers are repeated per location because an add_header inside
        # one drops every header inherited from the server.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "{{ $csp }}" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
        }
        # A public link's reading view: logged nowhere, cached by nobody.
        location ~ ^/public/([^/]+/)?link/ {
            access_log off;
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "{{ $csp }}" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }
        # The render service's print views: one may carry a link's token.
        location ^~ /print/ {
            access_log off;
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "{{ $csp }}" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Content-Security-Policy "{{ $csp }}" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
        }
    }
