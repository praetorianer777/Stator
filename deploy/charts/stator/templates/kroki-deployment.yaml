{{- if .Values.kroki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stator.fullname" . }}-kroki
  labels:
    {{- include "stator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kroki
spec:
  replicas: {{ .Values.kroki.replicas }}
  selector:
    matchLabels:
      {{- include "stator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kroki
  template:
    metadata:
      labels:
        {{- include "stator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kroki
      {{- with .Values.kroki.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "stator.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's own user, kroki, by number: the image names it by name,
      # which runAsNonRoot cannot check.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kroki
          image: {{ include "stator.image" (dict "root" $ "name" "kroki") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # Unsafe mode lets PlantUML include any file of the container and
            # any address, so it is never a value.
            - name: KROKI_SAFE_MODE
              value: secure
            - name: KROKI_PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          # PlantUML, Graphviz and Vert.x write scratch files here alone.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.kroki.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.kroki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kroki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kroki.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
