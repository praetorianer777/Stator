{{- if .Values.render.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stator.fullname" . }}-render
  labels:
    {{- include "stator.labels" . | nindent 4 }}
    app.kubernetes.io/component: render
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
  selector:
    {{- include "stator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: render
{{- end }}
