server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The api resolves by service name at request time rather than once at
    # start, so nginx survives the api container being recreated under it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # The API is served from the same origin as the app, so the session cookie
    # is first-party and no CORS configuration is involved. Its answers carry
    # the api's own security headers, which are stricter than the app's.
    location /api/ {
        # The api decides how large an upload may be; nginx does not second-guess it.
        client_max_body_size 0;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A page's shared draft is a WebSocket, which needs HTTP/1.1 and the
    # upgrade passed on. The api pings it every 25 seconds, well inside the
    # minute of quiet after which nginx would close it.
    location ~ ^/api/v1/pages/[^/]+/collab$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A public link's token is the whole of the link, and an access log writes
    # an address whole; the api blanks it in its own log.
    location ~ ^/api/v1/public/[^/]+/links/ {
        access_log off;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The probes sit outside /api/ in the api; passing them through lets the
    # container's health check, and a load balancer, see the whole chain.
    location = /healthz {
        proxy_pass $api;
    }
    location = /readyz {
        proxy_pass $api;
    }

    # nginx's type table has no entry for a web app manifest, which would be
    # served as an anonymous download. No add_header here, so the server's own
    # headers still apply.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # The security headers are repeated in both static locations because an
    # add_header inside a location drops every one inherited from the server.
    # The app needs inline styles (Tailwind writes them) and talks to its own
    # origin only.

    # Hashed build assets never change under the same name. One header rather
    # than expires plus add_header, which would send Cache-Control twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.figma.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The reading view of a public link carries its token in the address: it
    # is logged nowhere, kept by no cache and sent on as no referrer.
    location ~ ^/public/[^/]+/link/ {
        access_log off;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.figma.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # The print views the render service opens to make a PDF: one may carry a
    # public link's token, so like the link's own view they are logged nowhere
    # and kept by no cache.
    location ^~ /print/ {
        access_log off;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.figma.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Client side routing: unknown paths are app routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.figma.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
