# The development and test stack. Run it through make (mk/stack.mk), which
# names the project and picks the host ports from the checkout's path so that
# parallel worktrees never share a database or collide on a port; the defaults
# below are what a bare `docker compose` gets.
name: stator

x-db-env: &db-env
  POSTGRES_USER: stator
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stator}
  POSTGRES_DB: stator

# The api, worker and seed connect as stator_app, which row level security
# constrains, and as stator_admin for what runs before a tenant is known.
x-app-db-env: &app-db-env
  STATOR_ENV: development
  STATOR_DB_PRIMARY_URL: postgres://stator_app:${APP_DB_PASSWORD:-stator_app}@postgres-primary:5432/stator?sslmode=disable
  STATOR_DB_REPLICA_URLS: postgres://stator_app:${APP_DB_PASSWORD:-stator_app}@postgres-replica:5432/stator?sslmode=disable
  STATOR_DB_ADMIN_URL: postgres://stator_admin:${ADMIN_DB_PASSWORD:-stator_admin}@postgres-primary:5432/stator?sslmode=disable
  # Read-your-writes positions, shared by every api process.
  STATOR_VALKEY_URL: redis://:${VALKEY_PASSWORD:-stator_valkey}@valkey:6379/0

# Uploaded files go to the stack's SeaweedFS; the api makes the bucket if it is
# missing.
x-s3-env: &s3-env
  STATOR_S3_ENDPOINT: seaweedfs:8333
  STATOR_S3_BUCKET: stator-files
  STATOR_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stator}
  STATOR_S3_SECRET_KEY: ${S3_SECRET_KEY:-stator-dev-secret}
  # The largest file a page takes; nginx passes any size through to the api.
  STATOR_UPLOAD_LIMIT: 50MB
  # Office documents are converted to PDF here for their previews.
  STATOR_CONVERTER_URL: http://converter:3000
  # Pages are printed to PDF here; it reaches the web container by name, so
  # the api only ever hands it a path and a credential.
  STATOR_RENDER_URL: http://render:8090

# Sign-in. The key seals the provider's client secret and is for development
# only. The browser reaches Keycloak on the published port, which is also the
# issuer its tokens name; the api asks for it there while connecting to
# keycloak:8080. The callback defaults to STATOR_APP_URL, which nginx proxies.
x-auth-env: &auth-env
  STATOR_APP_URL: http://localhost:${WEB_PORT:-8000}
  STATOR_SECRET_KEY: &secret-key ${STATOR_SECRET_KEY:-c3RhdG9yLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWs=}
  STATOR_OIDC_BACKCHANNEL: http://localhost:${KEYCLOAK_PORT:-8180}=http://keycloak:8080

# Armature, as the stub stands in for it. An administrator connects
# http://localhost:${ARMATURE_STUB_PORT}, the address a browser opens; the api
# and the worker reach it on the stack's network. The guard lets the stub's
# host through here, and the web container's, the one page inside the network
# the browser suite's link previews can read; the chart allows nothing inside
# the network. For a
# real Armature on the host, see docs/api-contract-m3.md.
x-armature-env: &armature-env
  STATOR_OUTBOUND_ALLOW: armature-stub,web
  STATOR_ARMATURE_BACKCHANNEL: http://localhost:${ARMATURE_STUB_PORT:-8190}=http://armature-stub:8080

# Who an organization of the stack is made with: the realm's people, let in
# ahead of time, and the realm as its provider. The seed gives them to demo;
# the api gives them to every throwaway organization of the browser suite.
# Anybody else the realm signs in waits for an administrator.
x-bootstrap-env: &bootstrap-env
  STATOR_BOOTSTRAP_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/stator-dev
  STATOR_BOOTSTRAP_OIDC_CLIENT_ID: stator
  STATOR_BOOTSTRAP_OIDC_CLIENT_SECRET: stator-dev-secret
  STATOR_BOOTSTRAP_MEMBERS: alice@stator.test=admin,bob@stator.test=member

# Every Go service runs the same image, which migrate alone builds. Compose
# runs each service's build at once, and the classic builder then tags one
# name from all of them: two taggings racing failed the stack's start.
x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-stator}-backend
  pull_policy: never

services:
  postgres-primary:
    image: postgres:18-alpine
    environment:
      <<: *db-env
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-stator_app}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-stator_admin}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      # scram-sha-256 for replication connections as well as client ones.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      # Surfaces the standby's replay position on the primary, which the
      # api's replica health check reads.
      - -c
      - track_commit_timestamp=on
      # A commit does not wait for its WAL to reach the disk: on a busy host
      # one flush took up to 9 s, longer than the browser suite waits. A crash
      # loses under a second of writes, never consistency. Never in the chart
      # or in production; see docs/decisions.md.
      - -c
      - synchronous_commit=off
    volumes:
      - primary-data:/var/lib/postgresql/18/docker
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP on purpose: the image's first-boot server listens on the
      # socket only, so this passes once the init scripts have run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U stator -d stator"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
      start_interval: 1s

  # A genuine streaming replica rather than a second database: read routing
  # and the replica health checks only mean something against real replication.
  postgres-replica:
    image: postgres:18-alpine
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      <<: *db-env
      PRIMARY_HOST: postgres-primary
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      REPLICATION_SLOT: stator_replica_1
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - replica-data:/var/lib/postgresql/18/docker
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U stator -d stator"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 1s

  # Valkey, the BSD licensed fork of Redis: read-your-writes positions now,
  # caches and rate limits later.
  valkey:
    image: valkey/valkey:8-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-stator_valkey}
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:-stator_valkey}"]
    volumes:
      - valkey-data:/data
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 1s

  # Catches every outbound mail; nothing ever leaves the host. The image
  # carries its own health check.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # S3 compatible attachment storage, so the storage code path is the same in
  # development and production. One container is the whole of SeaweedFS here:
  # master, volume server, filer and the S3 gateway. Given these two variables
  # it refuses unsigned requests, so there is no credentials file to keep in
  # step with the ones the api is handed.
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=256"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-stator}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-stator-dev-secret}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      # The master says the cluster is up; the second call proves the S3 port
      # is listening, where 403 to an unsigned request is the healthy answer.
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:9333/cluster/healthz >/dev/null && curl -s -o /dev/null http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
      start_interval: 1s

  # Converts office documents to PDF for their previews: a headless office
  # suite behind a small HTTP API, which only the api calls, so it publishes
  # no port. Its browser half is never started and its routes are off.
  converter:
    image: gotenberg/gotenberg:8.25.1
    command:
      - gotenberg
      - --chromium-auto-start=false
      - --chromium-disable-routes=true
      - --libreoffice-auto-start=true
      - --webhook-disable=true
      - --prometheus-disable-collect=true
      # Longer than the api waits for one conversion, so the api is the one
      # that gives up and says so.
      - --api-timeout=30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 1s

  # Prints pages as PDF for export, adapted from Armature's: a headless
  # Chromium with puppeteer behind a small HTTP API, which only the api
  # calls, so it publishes no port. The script is mounted from the
  # repository; deploy/Dockerfile.render bakes it in for a cluster.
  render:
    image: zenika/alpine-chrome:with-puppeteer
    entrypoint: ["node"]
    command: ["/usr/src/app/render/server.mjs"]
    working_dir: /usr/src/app
    depends_on:
      web:
        condition: service_healthy
    environment:
      HOME: /tmp
      RENDER_PORT: "8090"
      RENDER_APP_URL: http://web
    volumes:
      - ../render:/usr/src/app/render:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
      start_interval: 1s

  # The identity provider. The realm is imported afresh on every start, so no
  # volume: a mounted data directory would be root owned while the image runs
  # unprivileged. The browser reaches it on the published port, containers as
  # keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      # The image has no curl; bash can open a socket to the management port.
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf ''GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3; grep -q UP <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
      start_interval: 2s

  # Migrations run as the database owner, which is what lets them create the
  # runtime roles' default privileges.
  migrate:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: ["/app/migrate", "up"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      STATOR_DB_PRIMARY_URL: postgres://stator:${POSTGRES_PASSWORD:-stator}@postgres-primary:5432/stator?sslmode=disable
    restart: "no"

  seed:
    <<: *backend
    command: ["/app/seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*app-db-env, *auth-env, *bootstrap-env]
      # A way in before single sign-on, and the demo organization pointed at
      # the stack's realm, so make up ends with a working SSO sign-in.
      STATOR_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@stator.test}
      STATOR_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-stator admin password}
    restart: "no"

  api:
    <<: *backend
    command: ["/app/api"]
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      converter:
        condition: service_healthy
      armature-stub:
        condition: service_healthy
      # After the seed rather than beside it: a stack that answers is one a
      # browser test can sign in to, and `up --wait` accepts a one-shot
      # container only when something waits for it.
      seed:
        condition: service_completed_successfully
    environment:
      # The session cookie is checked against the origin the browser uses,
      # which is the web container's published port; auth-env names it.
      <<: [*app-db-env, *s3-env, *auth-env, *bootstrap-env, *armature-env]
      STATOR_HTTP_ADDR: ":8080"
      STATOR_LOG_LEVEL: debug
      # The browser suite makes an organization per spec file through these;
      # the Helm chart never sets them.
      STATOR_TEST_ENDPOINTS: "1"
      STATOR_TEST_ENDPOINTS_TOKEN: ${STATOR_TEST_ENDPOINTS_TOKEN:-stator-dev-test-endpoints-token}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  worker:
    <<: *backend
    command: ["/app/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      <<: [*app-db-env, *s3-env, *armature-env]
      STATOR_LOG_LEVEL: debug
      STATOR_APP_URL: http://localhost:${WEB_PORT:-8000}
      # Opens the members' Armature tokens, to sync page links as them.
      STATOR_SECRET_KEY: *secret-key
      # Every notification mail lands in Mailpit, as in Armature.
      STATOR_SMTP_ADDR: mailpit:1025
      STATOR_MAIL_FROM: Stator <no-reply@stator.test>
      # A verification made to run out in a test is told within seconds.
      STATOR_VERIFICATION_CHECK_INTERVAL: 10s
      # So is a task whose day a test sets to today.
      STATOR_TASK_DUE_CHECK_INTERVAL: 10s
      # A publish a test schedules a few seconds ahead goes out within them.
      STATOR_SCHEDULE_CHECK_INTERVAL: 1s
      # The example space a test asks for is begun within a second.
      STATOR_EXAMPLE_CHECK_INTERVAL: 1s
    healthcheck:
      # The worker serves nothing but its metrics, so they are its sign of life.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/metrics"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Stands in for Armature: the part of its API Stator calls, in its shapes,
  # held to Armature's document by a contract test. Never in the chart.
  armature-stub:
    <<: *backend
    command: ["/app/armature-stub"]
    ports:
      - "127.0.0.1:${ARMATURE_STUB_PORT:-8190}:8080"
    healthcheck:
      test: ["CMD", "/app/armature-stub", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  web:
    image: ${COMPOSE_PROJECT_NAME:-stator}-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    healthcheck:
      # Through nginx to the api and its database: healthy means the whole
      # chain a browser uses answers.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  primary-data:
  replica-data:
  valkey-data:
  seaweedfs-data:
