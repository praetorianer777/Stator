# The PR gate. It holds nothing but run-tests.sh on purpose: whatever gates a
# push locally through the branch-guard hook is exactly what gates it here, so
# the two can never drift apart. Toolchains run in containers through the
# Makefile, so the runner needs only Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The release tests read tags, which a shallow checkout does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: ./run-tests.sh

      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
