# The PR gate. Every job runs ./run-tests.sh for some of its layers, so
# whatever gates a push locally through the branch-guard hook is exactly what
# gates it here, split across jobs that run side by side; tests/test-ci.sh
# fails when the jobs between them leave a layer or a part of the browser
# suite out. Toolchains run in containers through the Makefile, so a runner
# needs only Docker. See docs/decisions.md for why the gate is split this way.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  # A run by hand can take the gate several times in a row, so a flaky
  # test shows up as a failure rather than hiding behind one lucky pass.
  workflow_dispatch:
    inputs:
      runs:
        description: How many times in a row each job runs its layers (at most 5)
        type: number
        default: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The slowest job takes about 10 minutes, so a run gets 30 and a run by
    # hand of up to 5 gates 4 times that. Expressions here cannot multiply.
    timeout-minutes: ${{ inputs.runs > 1 && 120 || 30 }}
    strategy:
      # Every job runs to its end, so a red run still reports every layer.
      fail-fast: false
      matrix:
        include:
          - name: shell and format
            layers: shell check-format
          - name: check-go
            layers: check-go
            go-cache: unit
          - name: check-web
            layers: check-web
            npm-cache: web
          - name: test-integration
            layers: test-integration
            go-cache: integration
          # Each part brings up a stack of its own; Playwright splits the
          # tests between them by count.
          - name: test-e2e 1/4
            layers: test-e2e
            shard: 1/4
            npm-cache: e2e
          - name: test-e2e 2/4
            layers: test-e2e
            shard: 2/4
            npm-cache: e2e
          - name: test-e2e 3/4
            layers: test-e2e
            shard: 3/4
            npm-cache: e2e
          - name: test-e2e 4/4
            layers: test-e2e
            shard: 4/4
            npm-cache: e2e
    steps:
      # The release tests read tags, which a shallow checkout does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Restored on every run, saved only from main: a pull request reads
      # main's caches, and its own would only crowd them out.
      - name: Restore the Go module and build cache
        if: matrix.go-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/go
          key: go-${{ matrix.go-cache }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ matrix.go-cache }}-${{ hashFiles('backend/go.sum') }}-
            go-${{ matrix.go-cache }}-

      - name: Restore the npm cache
        if: matrix.npm-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/npm
          key: npm-${{ matrix.npm-cache }}-${{ hashFiles(format('{0}/package-lock.json', matrix.npm-cache)) }}
          restore-keys: npm-${{ matrix.npm-cache }}-

      - name: Run ${{ matrix.layers }}
        env:
          RUNS: ${{ inputs.runs || 1 }}
          SHARD: ${{ matrix.shard }}
        run: |
          for run in $(seq "$RUNS"); do
            echo "::group::Run $run of $RUNS"
            ./run-tests.sh ${{ matrix.layers }}
            echo "::endgroup::"
          done

      # A cancelled run otherwise ends in the middle of a passing test, which
      # reads like a failure of that test.
      - name: Say why the gate stopped
        if: cancelled()
        run: echo "::error title=Gate stopped::The gate was cancelled before it finished, by the job's time limit or by a newer push to this branch. No test failed; look at the run's duration, and if it reached the limit, raise timeout-minutes or make the suite faster."

      - name: Save the Go module and build cache
        if: matrix.go-cache && success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .cache/go
          key: go-${{ matrix.go-cache }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}

      # One job per key saves, so the browser jobs do not race to write theirs.
      - name: Save the npm cache
        if: (matrix.name == 'check-web' || matrix.shard == '1/4') && success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .cache/npm
          key: npm-${{ matrix.npm-cache }}-${{ hashFiles(format('{0}/package-lock.json', matrix.npm-cache)) }}

      # Green or red, the report job reads these for the run's summary.
      - name: Keep the layer's reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ strategy.job-index }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  report:
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gather the jobs' reports
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: reports

      - name: Restore the npm cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/npm
          key: npm-e2e-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: npm-e2e-

      # One HTML report for the whole browser suite, traces of failed tests
      # included, and its timings as JSON.
      - name: Merge the browser suite's reports
        run: |
          mkdir -p reports/e2e-blobs
          find reports -path '*/e2e-blob/*.zip' -exec cp {} reports/e2e-blobs/ \;
          if [ -n "$(ls reports/e2e-blobs)" ]; then make e2e-merge-reports; fi

      - name: Write the summary
        run: ./scripts/test-summary.sh reports | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Keep the timings
        uses: actions/upload-artifact@v4
        with:
          name: test-timings
          path: |
            reports/**/*.json
            reports/**/layers.tsv
          if-no-files-found: ignore
