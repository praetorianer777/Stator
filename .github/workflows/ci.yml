# The PR gate. It holds nothing but run-tests.sh on purpose: whatever gates a
# push locally through the branch-guard hook is exactly what gates it here, so
# the two can never drift apart. Toolchains run in containers through the
# Makefile, so the runner needs only Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  # A run by hand can take the gate several times in a row, so a flaky
  # test shows up as a failure rather than hiding behind one lucky pass.
  workflow_dispatch:
    inputs:
      runs:
        description: How many times in a row to run the gate (at most 5)
        type: number
        default: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # One gate takes 22 to 30 minutes on a hosted runner and grows with every
    # feature, so a run gets 45 and a run by hand of up to 5 gates gets 5 times
    # that. Expressions here cannot multiply, nor read env.
    timeout-minutes: ${{ inputs.runs > 1 && 225 || 45 }}
    steps:
      # The release tests read tags, which a shallow checkout does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the gate
        env:
          RUNS: ${{ inputs.runs || 1 }}
        run: |
          for run in $(seq "$RUNS"); do
            echo "::group::Gate run $run of $RUNS"
            ./run-tests.sh
            echo "::endgroup::"
          done

      # A cancelled run otherwise ends in the middle of a passing test, which
      # reads like a failure of that test.
      - name: Say why the gate stopped
        if: cancelled()
        run: echo "::error title=Gate stopped::The gate was cancelled before it finished, by the job's time limit or by a newer push to this branch. No test failed; look at the run's duration, and if it reached the limit, raise timeout-minutes or make the suite faster."

      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
